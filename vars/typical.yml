# the names and hosts of bootiful podcast on the typical foundation (cf/typical.env in
# application-concierge, api.cf.applicationconcierge.com). no secrets here.

# where the apps go. bin/deploy.sh targets these itself.
org: bootiful-podcast
space: production

registry: us-docker.pkg.dev/joshlong/bootiful-podcast-artifact-registry
# a private domain of the bootiful-podcast org, whose dns and certificate the foundation hosts
# (README.md, "DNS"). cf push fails on a route under a domain cf doesn't have.
domain: bootifulpodcast.fm
apps-domain: apps.applicationconcierge.com
site-host: bootiful-podcast
